name: Development Build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build development jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream master
        uses: actions/checkout@v4
        with:
          repository: PlayPro/CoreProtect
          ref: master
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B package -Dproject.branch=development

      - name: Determine build metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          JAR_PATH=$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Skip if this commit was already published
        id: check
        run: |
          if gh release view "dev-${{ steps.vars.outputs.sha_short }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload build artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.jar_name }}
          path: ${{ steps.vars.outputs.jar_path }}
          retention-days: 30

      - name: Publish development build release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ steps.vars.outputs.sha_short }}
          name: Development build ${{ steps.vars.outputs.sha_short }}
          prerelease: true
          make_latest: true
          body: |
            Automated build of PlayPro/CoreProtect@master, commit ${{ steps.vars.outputs.sha_full }}.

            This tracks the public upstream repository on a schedule (every 6 hours) plus manual runs. It is not the same as the early-access builds available to Patreon supporters on coreprotect.net, which are built from unreleased source not present in this public repository.

            This is an unreleased development build, not an official CoreProtect release. Use at your own risk.
          files: ${{ steps.vars.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old development releases
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("dev-")) | .tagName' \
            | tail -n +6 \
            | xargs -r -n1 -I{} gh release delete {} --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
