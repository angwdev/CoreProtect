name: Development Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build development jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B package

      - name: Determine build metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          JAR_PATH=$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.jar_name }}
          path: ${{ steps.vars.outputs.jar_path }}
          retention-days: 30

      - name: Publish latest development build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest development build (${{ steps.vars.outputs.sha_short }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automated development build from commit ${{ github.sha }}.

            This is an unreleased development build, not an official CoreProtect release. Use at your own risk.
          files: ${{ steps.vars.outputs.jar_path }}
